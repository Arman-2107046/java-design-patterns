name: Java CI

on:
  push:
    branches: [ master, feature/* ]  # triggers on master and all feature branches

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'

      - name: Compile Java files
        run: javac **/*.java
